name: Release

# ═══════════════════════════════════════════════════════════════════════════════
# FULLY AUTOMATED — developer just `git push`, no other steps needed.
#
# push to main  →  auto-tag v1.0.0-dev.{run_number}  →  build all platforms →  release
# push tag v*   →  stable release v1.0.1              →  build all platforms →  release
#
# Tester reopens the app → auto-update dialog → download & install.
# ═══════════════════════════════════════════════════════════════════════════════

on:
  push:
    branches: [feature/auto-update]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Auto-version: reads pubspec.yaml, sets tag name ────────────────────────
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set.outputs.tag }}
      prerelease: ${{ steps.set.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5

      - id: set
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: *//')
          SEMVER="${VER%%+*}"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "tag=v${SEMVER}-dev.$GITHUB_RUN_NUMBER" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

  # ── Android APK (ubuntu, cached Flutter SDK) ────────────────────────────────
  build-android:
    name: APK
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - name: Setup .env
        run: |
          echo "FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }}" > .env
          echo "BACKEND_BASE_URL=${{ secrets.BACKEND_BASE_URL }}" >> .env
          echo "BACKEND_API_KEY=${{ secrets.BACKEND_API_KEY }}" >> .env

      - name: Setup signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.p12
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=upload"
            echo "storeFile=upload-keystore.p12"
          } > android/key.properties

      - run: flutter build apk --release --android-skip-build-dependency-validation --dart-define=GITHUB_TOKEN=${{ secrets.RELEASE_READ_TOKEN }}

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # ── iOS IPA (skipped — unsigned, requires Apple Developer account) ─────────
  build-ios:
    if: false
    name: IPA
    needs: [version]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - name: Setup .env
        run: |
          echo "FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }}" > .env
          echo "BACKEND_BASE_URL=${{ secrets.BACKEND_BASE_URL }}" >> .env
          echo "BACKEND_API_KEY=${{ secrets.BACKEND_API_KEY }}" >> .env

      - run: flutter build ios --release --no-codesign --dart-define=GITHUB_TOKEN=${{ secrets.RELEASE_READ_TOKEN }}

      - run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r app-release.ipa Payload

      - uses: actions/upload-artifact@v7
        with:
          name: ipa
          path: build/ios/iphoneos/app-release.ipa

  # ── Windows desktop ───────────────────────────────────────────────────────
  build-windows:
    name: Windows
    needs: [version]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      # Scaffold the windows/ folder (not committed yet) so the build works.
      - name: Scaffold Windows platform
        run: flutter create --platforms=windows --org com.scanco --project-name scanco .

      # firebase_cpp_sdk ships an old cmake_minimum_required(<3.5) that CMake 3.31+
      # rejects. Set the policy minimum at the top level so subprojects build anyway.
      - name: Work around firebase_cpp_sdk CMake minimum version
        shell: pwsh
        run: |
          $cm = 'windows\CMakeLists.txt'
          $content = Get-Content $cm -Raw
          if ($content -notmatch 'CMAKE_POLICY_VERSION_MINIMUM') {
            Set-Content -Path $cm -Value "set(CMAKE_POLICY_VERSION_MINIMUM 3.5)`n$content" -NoNewline
          }

      - run: flutter pub get

      - name: Setup .env
        run: |
          echo "FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }}" > .env
          echo "BACKEND_BASE_URL=${{ secrets.BACKEND_BASE_URL }}" >> .env
          echo "BACKEND_API_KEY=${{ secrets.BACKEND_API_KEY }}" >> .env

      - run: flutter build windows --release --dart-define=GITHUB_TOKEN=${{ secrets.RELEASE_READ_TOKEN }}

      - name: Package Windows app
        shell: pwsh
        run: Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "scanco-windows.zip" -Force

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: scanco-windows.zip

  # ── Linux desktop ─────────────────────────────────────────────────────────
  build-linux:
    name: Linux
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev

      # Scaffold the linux/ folder (not committed yet) so the build works.
      - name: Scaffold Linux platform
        run: flutter create --platforms=linux --org com.scanco --project-name scanco .

      - run: flutter pub get

      - name: Setup .env
        run: |
          echo "FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }}" > .env
          echo "BACKEND_BASE_URL=${{ secrets.BACKEND_BASE_URL }}" >> .env
          echo "BACKEND_API_KEY=${{ secrets.BACKEND_API_KEY }}" >> .env

      - run: flutter build linux --release --dart-define=GITHUB_TOKEN=${{ secrets.RELEASE_READ_TOKEN }}

      - name: Package Linux app
        run: tar -czf scanco-linux.tar.gz -C build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: scanco-linux.tar.gz

  # ── macOS desktop ─────────────────────────────────────────────────────────
  build-macos:
    name: macOS
    needs: [version]
    runs-on: macos-latest
    # Flutter 3.47.x AOT snapshotter crashes on macOS release builds
    # ("Class with illegal cid" in _window_macos.dart). Keep building so we can
    # see when a fixed Flutter lands, but never block the release.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      # Scaffold the macos/ folder (not committed yet) so the build works.
      - name: Scaffold macOS platform
        run: flutter create --platforms=macos --org com.scanco --project-name scanco .

      - run: flutter pub get

      - name: Setup .env
        run: |
          echo "FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }}" > .env
          echo "BACKEND_BASE_URL=${{ secrets.BACKEND_BASE_URL }}" >> .env
          echo "BACKEND_API_KEY=${{ secrets.BACKEND_API_KEY }}" >> .env

      - run: flutter clean
      - run: flutter build macos --release --dart-define=GITHUB_TOKEN=${{ secrets.RELEASE_READ_TOKEN }}

      - name: Package macOS app
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/Runner.app scanco-macos.zip

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: scanco-macos.zip

  # ── Create release + auto-create lightweight tag ──────────────────────────
  release:
    name: Release
    needs: [version, build-android, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with: { name: apk }

      - uses: actions/download-artifact@v7
        with: { name: windows }

      - uses: actions/download-artifact@v7
        with: { name: linux }

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          files: |
            app-release.apk
            scanco-windows.zip
            scanco-linux.tar.gz
          generate_release_notes: true
