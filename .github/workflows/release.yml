name: Release

# ═══════════════════════════════════════════════════════════════════════════════
# FULLY AUTOMATED — developer just `git push`, no other steps needed.
#
# push any branch → pre-release v1.0.0-{label}.{run_number} (label = source branch)
#                  main/master → -main. · dev/develop → -dev. · other → sanitized branch
#                  precedence: stable tag > main > dev > other branch > numeric (0)
# push tag v*     → stable release v1.0.1 (top precedence, never auto-bumped)
#
# Branch pushes build ONLY android + windows + linux (fast dev loop). macOS and
# iPhone are skippable — they run on tag releases (v*) or when chosen via
# workflow_dispatch (all / desktop).
#
# Tester reopens the app → auto-update dialog → download & install.
# ═══════════════════════════════════════════════════════════════════════════════

on:
  push:
    branches: [feature/auto-update]
    tags:
      - 'v*'
  # Manual trigger — pick which platforms to build.
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - desktop
          - android-windows-linux

permissions:
  contents: write

jobs:
  # ── Compute release tag: read pubspec version, derive branch label, set tag ─
  # Resolves the exact release tag this run publishes — nothing is bumped
  # blindly. Reads the version from pubspec.yaml, derives the pre-release label
  # from the source BRANCH (not hardcoded), so the same workflow works on any
  # branch without producing fake "dev" releases:
  #   branch push → v{version}-{label}.{run_number}  (pre-release)
  #   tag push    → the pushed tag itself             (stable release)
  # Precedence (semver pre-release identifiers): stable > main > dev > other > 0
  bump-version:
    name: Compute release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set.outputs.tag }}
      label: ${{ steps.set.outputs.label }}
      prerelease: ${{ steps.set.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5

      - id: set
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: *//')
          SEMVER="${VER%%+*}"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Explicit tag push → stable release (top precedence).
            echo "tag=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT
            echo "label=stable" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            # Branch push → pre-release; label comes from the branch name so
            # main/master → "main", dev/develop → "dev", others → sanitized.
            BRANCH="${GITHUB_REF_NAME}"
            case "$BRANCH" in
              main|master) LABEL="main" ;;
              dev|develop) LABEL="dev" ;;
              *)           LABEL="$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]\+/-/g; s/^-//; s/-$//')" ;;
            esac
            [[ -z "$LABEL" ]] && LABEL="dev"
            echo "tag=v${SEMVER}-${LABEL}.$GITHUB_RUN_NUMBER" >> $GITHUB_OUTPUT
            echo "label=$LABEL" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

  # ── Unit tests: auto-update routine (desktop) ────────────────────────────
  # Runs the update-routine tests (isNewer/assetSuffix + DesktopUpdater script
  # templates) on Linux AND Windows so both desktop code paths are exercised.
  # Builds run in PARALLEL with these; the release (publish) depends on them —
  # a failing test cancels the in-flight builds and blocks the release.
  test:
    name: Tests (updater)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      # pubspec bundles `.env` as an asset — without the file the test's
      # asset bundle fails to build ("No file or variants found for asset:
      # .env"). Mirror the build jobs' Setup .env step.
      - name: Setup .env
        run: |
          echo "FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }}" > .env
          echo "BACKEND_BASE_URL=${{ secrets.BACKEND_BASE_URL }}" >> .env
          echo "BACKEND_API_KEY=${{ secrets.BACKEND_API_KEY }}" >> .env

      - name: Auto-update routine tests
        run: flutter test test/services/update_service_test.dart test/services/desktop_updater_test.dart

  # If the matrix tests failed, stop the in-flight builds — no point burning
  # runner minutes on artifacts that will never be released. The run is already
  # marked failed, and `publish` is skipped because it needs `test`.
  cancel-on-test-failure:
    name: Cancel builds (tests failed)
    if: ${{ failure() }}
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Cancel in-flight jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }}

  # ── Android APK (ubuntu, cached Flutter SDK) ────────────────────────────────
  build-android:
    name: Android
    needs: [bump-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - name: Setup .env
        run: |
          echo "FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }}" > .env
          echo "BACKEND_BASE_URL=${{ secrets.BACKEND_BASE_URL }}" >> .env
          echo "BACKEND_API_KEY=${{ secrets.BACKEND_API_KEY }}" >> .env

      - name: Setup signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.p12
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=upload"
            echo "storeFile=upload-keystore.p12"
          } > android/key.properties

      - run: flutter build apk --release --android-skip-build-dependency-validation --dart-define=APP_BUILD=${{ github.run_number }} --dart-define=APP_LABEL=${{ needs.bump-version.outputs.label }}

      - name: Rename APK to ScanCo.apk
        run: cp build/app/outputs/flutter-apk/app-release.apk ScanCo.apk

      - name: Verify APK
        run: |
          test -s ScanCo.apk
          unzip -l ScanCo.apk | grep -q 'classes.dex'
          echo "APK OK ($(stat -c%s ScanCo.apk) bytes)"

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: ScanCo.apk

  # ── iOS (iPhone) build — unsigned IPA ─────────────────────────────────────
  build-ios:
    name: iPhone
    # Skippable: run only on tag releases (v*) or when selected via
    # workflow_dispatch (all). Branch pushes skip it to keep the dev loop fast.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.platforms == 'all') || startsWith(github.ref, 'refs/tags/') }}
    needs: [bump-version]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - name: Setup .env
        run: |
          echo "FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }}" > .env
          echo "BACKEND_BASE_URL=${{ secrets.BACKEND_BASE_URL }}" >> .env
          echo "BACKEND_API_KEY=${{ secrets.BACKEND_API_KEY }}" >> .env

      - run: flutter build ios --release --no-codesign --dart-define=APP_BUILD=${{ github.run_number }} --dart-define=APP_LABEL=${{ needs.bump-version.outputs.label }}

      - run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ScanCo.ipa Payload

      - name: Verify IPA
        run: |
          unzip -l build/ios/iphoneos/ScanCo.ipa | grep -q 'Payload/.*\.app/'
          echo "IPA OK ($(stat -f%z build/ios/iphoneos/ScanCo.ipa) bytes)"

      - uses: actions/upload-artifact@v7
        with:
          name: iphone
          path: build/ios/iphoneos/ScanCo.ipa

  # ── Windows desktop ───────────────────────────────────────────────────────
  build-windows:
    name: Windows
    needs: [bump-version]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      # Scaffold the windows/ folder (not committed yet) so the build works.
      - name: Scaffold Windows platform
        run: flutter create --platforms=windows --org com.scanco --project-name scanco .

      # firebase_cpp_sdk ships an old cmake_minimum_required(<3.5) that CMake 3.31+
      # rejects. Set the policy minimum at the top level so subprojects build anyway.
      - name: Work around firebase_cpp_sdk CMake minimum version
        shell: pwsh
        run: |
          $cm = 'windows\CMakeLists.txt'
          $content = Get-Content $cm -Raw
          if ($content -notmatch 'CMAKE_POLICY_VERSION_MINIMUM') {
            Set-Content -Path $cm -Value "set(CMAKE_POLICY_VERSION_MINIMUM 3.5)`n$content" -NoNewline
          }

      - run: flutter pub get

      - name: Setup .env
        run: |
          echo "FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }}" > .env
          echo "BACKEND_BASE_URL=${{ secrets.BACKEND_BASE_URL }}" >> .env
          echo "BACKEND_API_KEY=${{ secrets.BACKEND_API_KEY }}" >> .env

      - run: flutter build windows --release --dart-define=APP_BUILD=${{ github.run_number }} --dart-define=APP_LABEL=${{ needs.bump-version.outputs.label }}

      - name: Package Windows app
        shell: pwsh
        run: Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "ScanCo.zip" -Force

      - name: Verify Windows package
        shell: pwsh
        run: |
          if (-not (Test-Path ScanCo.zip)) { throw 'ScanCo.zip missing' }
          $v = Join-Path $env:TEMP 'verify'
          Remove-Item $v -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path ScanCo.zip -DestinationPath $v
          if (-not (Test-Path (Join-Path $v 'scanco.exe'))) { throw 'scanco.exe missing from ScanCo.zip' }
          Write-Output "Windows OK: $((Get-Item ScanCo.zip).Length) bytes, scanco.exe present"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: ScanCo.zip

  # ── Linux desktop ─────────────────────────────────────────────────────────
  build-linux:
    name: Linux
    needs: [bump-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'beta'
          cache: true

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev

      # Scaffold the linux/ folder (not committed yet) so the build works.
      - name: Scaffold Linux platform
        run: flutter create --platforms=linux --org com.scanco --project-name scanco .

      - run: flutter pub get

      - name: Setup .env
        run: |
          echo "FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }}" > .env
          echo "BACKEND_BASE_URL=${{ secrets.BACKEND_BASE_URL }}" >> .env
          echo "BACKEND_API_KEY=${{ secrets.BACKEND_API_KEY }}" >> .env

      - run: flutter clean
      - run: flutter build linux --release --dart-define=APP_BUILD=${{ github.run_number }} --dart-define=APP_LABEL=${{ needs.bump-version.outputs.label }}

      - name: Package Linux app
        run: tar -czf ScanCo.tar.gz -C build/linux/x64/release/bundle .

      - name: Verify Linux package
        run: |
          tar -tzf ScanCo.tar.gz | grep -q 'scanco'
          echo "Linux OK ($(stat -c%s ScanCo.tar.gz) bytes)"

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: ScanCo.tar.gz

  # ── macOS desktop ─────────────────────────────────────────────────────────
  build-macos:
    name: macOS
    # Skippable: run only on tag releases (v*) or when selected via
    # workflow_dispatch (all / desktop). Branch pushes skip it to keep the dev
    # loop fast.
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.platforms == 'all' || inputs.platforms == 'desktop')) || startsWith(github.ref, 'refs/tags/') }}
    needs: [bump-version]
    runs-on: macos-latest
    # Flutter beta 3.48 fixed the desktop-AOT snapshotter bug that crashed
    # 3.47.x macOS release builds ("Class with illegal cid"). macOS is now a
    # full release platform (no continue-on-error — a real failure is real).
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'beta'
          cache: true

      # Scaffold the macos/ folder (not committed yet) so the build works.
      - name: Scaffold macOS platform
        run: flutter create --platforms=macos --org com.scanco --project-name scanco .

      - run: flutter pub get

      - name: Setup .env
        run: |
          echo "FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }}" > .env
          echo "BACKEND_BASE_URL=${{ secrets.BACKEND_BASE_URL }}" >> .env
          echo "BACKEND_API_KEY=${{ secrets.BACKEND_API_KEY }}" >> .env

      - run: flutter clean
      - run: flutter build macos --release --dart-define=APP_BUILD=${{ github.run_number }} --dart-define=APP_LABEL=${{ needs.bump-version.outputs.label }}

      - name: Package macOS app (DMG)
        run: hdiutil create -volname ScanCo -srcfolder build/macos/Build/Products/Release/scanco.app -ov -format UDZO ScanCo.dmg

      - name: Verify DMG
        run: |
          test -s ScanCo.dmg
          hdiutil verify ScanCo.dmg
          echo "DMG OK ($(stat -f%z ScanCo.dmg) bytes)"

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: ScanCo.dmg

  # ── Publish release (single job) ─────────────────────────────────────────
  # Creates ONE release on the PUBLIC releases repo with all ScanCo.* assets.
  # The app's auto-update reads releases from here (public → no token in app);
  # the private repo keeps no release — this is the single release step.
  # `if: !cancelled()` lets a failed platform still publish the working ones
  # (downloads are gated; missing files are skipped by gh-release).
  # Requires repo SECRET RELEASE_PUBLISH_TOKEN = fine-grained PAT
  # (Contents: write) on the public repo only — CI-only, never shipped.
  # If the public repo is named differently, change `repository:` below.
  publish:
    name: Publish release
    if: ${{ !cancelled() }}
    needs: [bump-version, test, build-android, build-windows, build-ios, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        if: ${{ needs.build-android.result == 'success' }}
        with: { name: android }
      - uses: actions/download-artifact@v7
        if: ${{ needs.build-windows.result == 'success' }}
        with: { name: windows }
      - uses: actions/download-artifact@v7
        if: ${{ needs.build-ios.result == 'success' }}
        with: { name: iphone }
      - uses: actions/download-artifact@v7
        if: ${{ needs.build-linux.result == 'success' }}
        with: { name: linux }
      - uses: actions/download-artifact@v7
        if: ${{ needs.build-macos.result == 'success' }}
        with: { name: macos }

      - uses: softprops/action-gh-release@v3
        with:
          repository: vofka198119-code/fomoshield-releases
          token: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
          tag_name: ${{ needs.bump-version.outputs.tag }}
          name: ${{ needs.bump-version.outputs.tag }}
          prerelease: ${{ needs.bump-version.outputs.prerelease }}
          files: |
            ScanCo.apk
            ScanCo.zip
            ScanCo.ipa
            ScanCo.tar.gz
            ScanCo.dmg
          overwrite_files: true

