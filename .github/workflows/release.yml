name: Release

# ═══════════════════════════════════════════════════════════════════════════════
# FULLY AUTOMATED — developer just `git push`, no other steps needed.
#
# push to main  →  auto-tag v1.0.0-dev.{run_number}  →  build all platforms →  release
# push tag v*   →  stable release v1.0.1              →  build all platforms →  release
#
# Tester reopens the app → auto-update dialog → download & install.
# ═══════════════════════════════════════════════════════════════════════════════

on:
  push:
    branches: [feature/auto-update]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Auto-version: reads pubspec.yaml, sets tag name ────────────────────────
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set.outputs.tag }}
      prerelease: ${{ steps.set.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5

      - id: set
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: *//')
          SEMVER="${VER%%+*}"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "tag=v${SEMVER}-dev.$GITHUB_RUN_NUMBER" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

  # ── Android APK (ubuntu, cached Flutter SDK) ────────────────────────────────
  build-android:
    name: Android
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - name: Setup .env
        run: |
          echo "FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }}" > .env
          echo "BACKEND_BASE_URL=${{ secrets.BACKEND_BASE_URL }}" >> .env
          echo "BACKEND_API_KEY=${{ secrets.BACKEND_API_KEY }}" >> .env

      - name: Setup signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.p12
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=upload"
            echo "storeFile=upload-keystore.p12"
          } > android/key.properties

      - run: flutter build apk --release --android-skip-build-dependency-validation --dart-define=APP_BUILD=${{ github.run_number }}

      - name: Rename APK to ScanCo.apk
        run: cp build/app/outputs/flutter-apk/app-release.apk ScanCo.apk

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: ScanCo.apk

  # ── iOS (iPhone) build — unsigned IPA ─────────────────────────────────────
  build-ios:
    name: iPhone
    needs: [version]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - name: Setup .env
        run: |
          echo "FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }}" > .env
          echo "BACKEND_BASE_URL=${{ secrets.BACKEND_BASE_URL }}" >> .env
          echo "BACKEND_API_KEY=${{ secrets.BACKEND_API_KEY }}" >> .env

      - run: flutter build ios --release --no-codesign --dart-define=APP_BUILD=${{ github.run_number }}

      - run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ScanCo.ipa Payload

      - uses: actions/upload-artifact@v7
        with:
          name: iphone
          path: build/ios/iphoneos/ScanCo.ipa

  # ── Windows desktop ───────────────────────────────────────────────────────
  build-windows:
    name: Windows
    needs: [version]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      # Scaffold the windows/ folder (not committed yet) so the build works.
      - name: Scaffold Windows platform
        run: flutter create --platforms=windows --org com.scanco --project-name scanco .

      # firebase_cpp_sdk ships an old cmake_minimum_required(<3.5) that CMake 3.31+
      # rejects. Set the policy minimum at the top level so subprojects build anyway.
      - name: Work around firebase_cpp_sdk CMake minimum version
        shell: pwsh
        run: |
          $cm = 'windows\CMakeLists.txt'
          $content = Get-Content $cm -Raw
          if ($content -notmatch 'CMAKE_POLICY_VERSION_MINIMUM') {
            Set-Content -Path $cm -Value "set(CMAKE_POLICY_VERSION_MINIMUM 3.5)`n$content" -NoNewline
          }

      - run: flutter pub get

      - name: Setup .env
        run: |
          echo "FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }}" > .env
          echo "BACKEND_BASE_URL=${{ secrets.BACKEND_BASE_URL }}" >> .env
          echo "BACKEND_API_KEY=${{ secrets.BACKEND_API_KEY }}" >> .env

      - run: flutter build windows --release --dart-define=APP_BUILD=${{ github.run_number }}

      - name: Package Windows app
        shell: pwsh
        run: Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "ScanCo.zip" -Force

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: ScanCo.zip

  # ── Linux desktop ─────────────────────────────────────────────────────────
  build-linux:
    name: Linux
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'beta'
          cache: true

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev

      # Scaffold the linux/ folder (not committed yet) so the build works.
      - name: Scaffold Linux platform
        run: flutter create --platforms=linux --org com.scanco --project-name scanco .

      - run: flutter pub get

      - name: Setup .env
        run: |
          echo "FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }}" > .env
          echo "BACKEND_BASE_URL=${{ secrets.BACKEND_BASE_URL }}" >> .env
          echo "BACKEND_API_KEY=${{ secrets.BACKEND_API_KEY }}" >> .env

      - run: flutter clean
      - run: flutter build linux --release --dart-define=APP_BUILD=${{ github.run_number }}

      - name: Package Linux app
        run: tar -czf ScanCo.tar.gz -C build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: ScanCo.tar.gz

  # ── macOS desktop ─────────────────────────────────────────────────────────
  build-macos:
    name: macOS
    needs: [version]
    runs-on: macos-latest
    # Flutter beta 3.48 fixed the desktop-AOT snapshotter bug that crashed
    # 3.47.x macOS release builds ("Class with illegal cid"). macOS is now a
    # full release platform (no continue-on-error — a real failure is real).
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'beta'
          cache: true

      # Scaffold the macos/ folder (not committed yet) so the build works.
      - name: Scaffold macOS platform
        run: flutter create --platforms=macos --org com.scanco --project-name scanco .

      - run: flutter pub get

      - name: Setup .env
        run: |
          echo "FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }}" > .env
          echo "BACKEND_BASE_URL=${{ secrets.BACKEND_BASE_URL }}" >> .env
          echo "BACKEND_API_KEY=${{ secrets.BACKEND_API_KEY }}" >> .env

      - run: flutter clean
      - run: flutter build macos --release --dart-define=APP_BUILD=${{ github.run_number }}

      - name: Package macOS app (DMG)
        run: hdiutil create -volname ScanCo -srcfolder build/macos/Build/Products/Release/scanco.app -ov -format UDZO ScanCo.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: ScanCo.dmg

  # ── Release ────────────────────────────────────────────────────────────────
  # One release per tag. `if: !cancelled()` means a failed build never blocks
  # the release: each platform attaches its asset on success, or appends a
  # failure note to the release body. All steps run sequentially in one job,
  # so there is no race updating the same release.
  release:
    name: Release
    if: ${{ !cancelled() }}
    needs: [version, build-android, build-windows, build-ios, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Ensure release exists
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          body: ScanCo build — per-platform results are attached / appended below.

      # ── Android ──
      - uses: actions/download-artifact@v7
        if: ${{ needs.build-android.result == 'success' }}
        with: { name: android }
      - uses: softprops/action-gh-release@v3
        if: ${{ needs.build-android.result == 'success' }}
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          overwrite_files: true
          files: ScanCo.apk
      - uses: softprops/action-gh-release@v3
        if: ${{ needs.build-android.result != 'success' }}
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          append_body: true
          body: "❌ **Android** — result: `${{ needs.build-android.result }}` (see run log)."

      # ── Windows ──
      - uses: actions/download-artifact@v7
        if: ${{ needs.build-windows.result == 'success' }}
        with: { name: windows }
      - uses: softprops/action-gh-release@v3
        if: ${{ needs.build-windows.result == 'success' }}
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          overwrite_files: true
          files: ScanCo.zip
      - uses: softprops/action-gh-release@v3
        if: ${{ needs.build-windows.result != 'success' }}
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          append_body: true
          body: "❌ **Windows** — result: `${{ needs.build-windows.result }}` (see run log)."

      # ── iPhone ──
      - uses: actions/download-artifact@v7
        if: ${{ needs.build-ios.result == 'success' }}
        with: { name: iphone }
      - uses: softprops/action-gh-release@v3
        if: ${{ needs.build-ios.result == 'success' }}
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          overwrite_files: true
          files: ScanCo.ipa
      - uses: softprops/action-gh-release@v3
        if: ${{ needs.build-ios.result != 'success' }}
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          append_body: true
          body: "❌ **iPhone** — result: `${{ needs.build-ios.result }}` (see run log)."

      # ── Linux ──
      - uses: actions/download-artifact@v7
        if: ${{ needs.build-linux.result == 'success' }}
        with: { name: linux }
      - uses: softprops/action-gh-release@v3
        if: ${{ needs.build-linux.result == 'success' }}
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          overwrite_files: true
          files: ScanCo.tar.gz
      - uses: softprops/action-gh-release@v3
        if: ${{ needs.build-linux.result != 'success' }}
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          append_body: true
          body: "❌ **Linux** — result: `${{ needs.build-linux.result }}` (see run log)."

      # ── macOS ──
      - uses: actions/download-artifact@v7
        if: ${{ needs.build-macos.result == 'success' }}
        with: { name: macos }
      - uses: softprops/action-gh-release@v3
        if: ${{ needs.build-macos.result == 'success' }}
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          overwrite_files: true
          files: ScanCo.dmg
      - uses: softprops/action-gh-release@v3
        if: ${{ needs.build-macos.result != 'success' }}
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          append_body: true
          body: "❌ **macOS** — result: `${{ needs.build-macos.result }}` (see run log)."

  # ── Mirror ScanCo.* binaries to the PUBLIC releases repo ──────────────────
  # The app's auto-update reads releases from here (public → no token in app).
  # Setup (once, in the repo settings):
  #   - create a PUBLIC repo, e.g. Anecho/fomoshield-releases
  #     (make at least one commit, e.g. README, so it has a default branch)
  #   - add repo SECRET  RELEASE_PUBLISH_TOKEN = fine-grained PAT
  #     (Contents: write) on that public repo ONLY — used by CI, never shipped
  #   - if the repo is named differently, change the `repository:` line below
  publish-public:
    name: Publish to public releases repo
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    needs: [version, build-android, build-windows, build-ios, build-linux, build-macos, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with: { name: android }
      - uses: actions/download-artifact@v7
        with: { name: windows }
      - uses: actions/download-artifact@v7
        with: { name: iphone }
      - uses: actions/download-artifact@v7
        with: { name: linux }
      - uses: actions/download-artifact@v7
        with: { name: macos }

      - uses: softprops/action-gh-release@v3
        with:
          repository: Anecho/fomoshield-releases
          token: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          files: |
            ScanCo.apk
            ScanCo.zip
            ScanCo.ipa
            ScanCo.tar.gz
            ScanCo.dmg
          overwrite_files: true
