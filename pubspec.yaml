name: scanco
description: "F.O.M.O. Shield — Invest with discipline, not emotion"
publish_to: 'none'
version: 1.0.0+148

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^15.1.2

  # Network
  dio: ^5.8.0+1

  # Environment

  # Storage
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.4

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.1.0
  fl_chart: ^0.70.2
  cached_network_image: ^3.4.1

  # Supabase
  supabase_flutter: ^2.8.3

  # Utils
  url_launcher: ^6.3.1
  intl: ^0.20.2
  google_sign_in: ^7.2.0
  package_info_plus: ^8.1.2

  # Crash reporting
  firebase_core: ^3.8.0
  firebase_crashlytics: ^4.1.5

  # In-app purchases (Play Billing) — real purchase flow wired up in
  # purchase_service.dart (2026-09-20), monthly base plan only so far.
  # in_app_purchase_android is normally just a transitive dependency of
  # in_app_purchase, but purchase_service.dart needs its Android-specific
  # types directly (GooglePlayProductDetails, GooglePlayPurchaseParam) to
  # pick a base plan's offer token — Android-only is fine, this app has no
  # iOS build yet (see feedback_ios_deprioritized_google_play_first memory).
  in_app_purchase: ^3.2.0
  in_app_purchase_android: ^0.5.0

  # Ads (AdMob) — rewarded/interstitial/app-open placements, see
  # ad_service.dart. Starts on Google's public test ad unit IDs (see
  # AndroidManifest.xml's test App ID) until a real AdMob account exists.
  google_mobile_ads: ^9.1.0

  # Google Play In-App Updates — lets the app itself prompt "an update is
  # available" instead of relying on the user to notice on the Play Store.
  # Only takes effect starting with the release that first ships it — see
  # in_app_update_service.dart.
  in_app_update: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon_flat.png"
  adaptive_icon_background: "#F7F7F5"
  adaptive_icon_foreground: "assets/images/fomoshield_logo.png"
  min_sdk_android: 21
